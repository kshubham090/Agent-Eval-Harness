name: Real-agent eval

on:
  workflow_dispatch:
    inputs:
      scorers:
        description: "Comma-separated scorers (embedding requires its optional dependency)"
        default: "exact,llm_judge"
      compare_baseline:
        description: "Optional baseline name. Create your own reproducible baseline first."
        default: ""

permissions:
  contents: read

jobs:
  real-eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e ".[judge]"
      - name: Eval real agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          EVAL_SCORERS: ${{ inputs.scorers }}
          EVAL_BASELINE: ${{ inputs.compare_baseline }}
        run: |
          gate_args=()
          if [ -n "$EVAL_BASELINE" ]; then
            gate_args=(--compare-baseline "$EVAL_BASELINE")
          fi
          python -m harness eval \
            --dataset datasets/examples/simple_qa.jsonl \
            --agent examples/claude_agent.py \
            --scorers "$EVAL_SCORERS" --concurrency 2 \
            --output results/real-agent.json --html results/real-agent.html \
            "${gate_args[@]}"
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-agent-evidence
          path: results/
